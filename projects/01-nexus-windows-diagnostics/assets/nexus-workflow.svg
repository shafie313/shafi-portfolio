<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">NEXUS Windows diagnostics project workflow</title>
  <desc id="desc">A Windows computer sends read-only system and network checks through the NEXUS PowerShell toolkit to HTML and CSV reports for a technician to review.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111D30"/>
      <stop offset="1" stop-color="#0B1424"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8" stop-opacity=".16"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1200" height="640" rx="24" fill="url(#bg)"/>
  <circle cx="940" cy="105" r="285" fill="url(#glow)"/>
  <g fill="#fff" fill-opacity=".035">
    <circle cx="74" cy="82" r="2"/><circle cx="1120" cy="184" r="2"/>
    <circle cx="1030" cy="552" r="2"/><circle cx="191" cy="535" r="2"/>
    <circle cx="748" cy="75" r="2"/><circle cx="474" cy="572" r="2"/>
  </g>
  <text x="64" y="72" fill="#38BDF8" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3">PROJECT 01 / WINDOWS IT SUPPORT</text>
  <text x="64" y="117" fill="#f4f5f7" font-family="Arial,sans-serif" font-size="30" font-weight="700">From a support check to a reviewable report</text>

  <g filter="url(#shadow)">
    <rect x="55" y="208" width="278" height="255" rx="18" fill="#111D30" stroke="#3B82F6" stroke-opacity=".3"/>
    <rect x="86" y="245" width="216" height="132" rx="10" fill="#17243a" stroke="#38BDF8" stroke-opacity=".7"/>
    <rect x="99" y="258" width="190" height="105" rx="5" fill="#0B1424"/>
    <path d="M163 396h62l9 19h-80z" fill="#5d6972"/>
    <rect x="143" y="415" width="102" height="8" rx="4" fill="#85919a"/>
    <text x="194" y="303" fill="#38BDF8" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700">WINDOWS PC</text>
    <text x="194" y="333" fill="#b8c1c6" text-anchor="middle" font-family="Arial,sans-serif" font-size="13">System / storage / network</text>
    <text x="194" y="448" fill="#e9ecef" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700">AUTHORIZED COMPUTER</text>
  </g>

  <path d="M350 336h95" fill="none" stroke="#3B82F6" stroke-width="3" stroke-linecap="round"/>
  <path d="m435 325 15 11-15 11" fill="none" stroke="#3B82F6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="398" y="315" fill="#9aa6a4" text-anchor="middle" font-family="Arial,sans-serif" font-size="12">read-only checks</text>

  <g filter="url(#shadow)">
    <rect x="456" y="208" width="288" height="255" rx="18" fill="#111D30" stroke="#3B82F6" stroke-opacity=".55"/>
    <rect x="481" y="235" width="238" height="34" rx="7" fill="#17243a"/>
    <circle cx="499" cy="252" r="4" fill="#38BDF8"/>
    <text x="512" y="256" fill="#a8b3b1" font-family="Arial,sans-serif" font-size="12">POWERSHELL / NEXUS v3.0</text>
    <text x="487" y="311" fill="#38BDF8" font-family="Consolas,monospace" font-size="17">&gt; Collect selected checks</text>
    <text x="487" y="345" fill="#b9c4c1" font-family="Consolas,monospace" font-size="15">  Organize results</text>
    <text x="487" y="379" fill="#b9c4c1" font-family="Consolas,monospace" font-size="15">  Save timestamped reports</text>
    <line x1="487" y1="403" x2="705" y2="403" stroke="#ffffff" stroke-opacity=".13"/>
    <text x="600" y="438" fill="#e9ecef" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700">NO AUTOMATIC REPAIRS</text>
  </g>

  <path d="M760 336h74" fill="none" stroke="#77d99d" stroke-width="3" stroke-linecap="round"/>
  <path d="m824 325 15 11-15 11" fill="none" stroke="#77d99d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="847" y="230" width="290" height="112" rx="15" fill="#111D30" stroke="#3B82F6" stroke-opacity=".3"/>
    <rect x="871" y="255" width="45" height="56" rx="5" fill="#17243a" stroke="#38BDF8" stroke-opacity=".65"/>
    <path d="M880 271h27m-27 9h27m-27 9h18" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
    <text x="935" y="275" fill="#f4f5f7" font-family="Arial,sans-serif" font-size="19" font-weight="700">HTML report</text>
    <text x="935" y="300" fill="#9ea9a7" font-family="Arial,sans-serif" font-size="13">Readable summary</text>
    <rect x="847" y="365" width="290" height="98" rx="15" fill="#111D30" stroke="#3B82F6" stroke-opacity=".3"/>
    <rect x="871" y="386" width="45" height="55" rx="5" fill="#17243a" stroke="#38BDF8" stroke-opacity=".65"/>
    <path d="M880 399h27m-27 8h27m-27 8h27m-27 8h27" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
    <text x="935" y="405" fill="#f4f5f7" font-family="Arial,sans-serif" font-size="19" font-weight="700">CSV file</text>
    <text x="935" y="430" fill="#9ea9a7" font-family="Arial,sans-serif" font-size="13">Structured results</text>
  </g>
  <text x="992" y="504" fill="#38BDF8" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1">TECHNICIAN REVIEWS</text>
  <text x="600" y="572" fill="#818b8e" text-anchor="middle" font-family="Arial,sans-serif" font-size="13">Concept illustration only — it does not show a real computer result.</text>
</svg>
